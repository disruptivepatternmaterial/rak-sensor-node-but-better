# Payload schema — firmware-side source of truth for the uplink encoder.
#
# This file is one half of a two-repo contract. The other half is the TTN uplink
# formatter in the forest-weather-machines repo. scripts/check_decoder_parity.py
# compares them on every build and fails if they have drifted.
#
# Status: DRAFT. FIRMWARE_SPEC.md §6 requires this be frozen before soak testing.
# Do not treat unresolved entries as decided.
#
# Rules: .cursor/rules/60-decoder-parity.mdc · Spec: docs/FIRMWARE_SPEC.md §6

decoder:
  repo: disruptivepatternmaterial/forest-weather-machines
  path: LoRaWAN/payload/rak-wx-station-default.js
  # Default lookup path; override with the FWM_REPO environment variable.
  local_path: ~/Documents/GitHub/forest-weather-machines
  pinned_commit: 058bd69acf07552c90da81122eaad2274a85a42a
  pinned_sha256: 717afcebeebd0a3d219aad5249bee04c0ddbcfd43059dae2a792bede4e91058b
  pinned_on: 2026-08-27
  # Re-pinned from efc0e3c/9c58c2b9 after the formatter was restructured upstream
  # (3cfd281 replaced the flat CHANNEL_NAMES string map with a CHANNELS map of
  # objects). Parity was re-verified BEFORE this re-pin, not assumed:
  #   - scripts/check_decoder_parity.py, taught the CHANNELS shape, passes all 9
  #     emitted fields against the live file.
  #   - scripts/check_golden_vectors.py PASSED 21 decoded values across 5 vectors
  #     with source "live" on the build host — real encoder bytes through this
  #     exact formatter in node, which is the check a field-by-field comparison
  #     cannot make.
  # Refs #83. Every emitted (channel,type) kept its decoded_key; no firmware change
  # was needed.
  # Re-pin ONLY after re-verifying parity. Re-pinning to silence the gate is the
  # exact failure this gate exists to prevent.

encoding:
  format: cayenne-lpp-style
  # Byte layout per field: [channel][type][value ...big-endian]
  # The decoder walks the buffer with no length prefix, so any size mismatch
  # desynchronizes every field after it.
  byte_order: big-endian
  null_policy: omit-field
  # A failed sensor read OMITS its channel entirely. It never encodes 0.
  # AGENTS.md · FIRMWARE_SPEC.md §2.1

# Fields this device emits. `decoded_key` is what lands in TTN after the formatter.
fields:
  - name: wind_speed
    channel: 1
    type: 190          # native RK900-09; type 158 (generic probe) also decodes correctly
    size: 2
    signed: false
    divisor: 100
    unit: m/s
    decoded_key: wx_wind_speed
    source: FIRMWARE_SPEC.md §2.1 reg 0x0000
    status: proposed

  - name: wind_direction
    channel: 2
    type: 191          # native; 159 also decodes correctly
    size: 2
    signed: false
    divisor: 1
    unit: deg
    decoded_key: wx_wind_direction
    source: FIRMWARE_SPEC.md §2.1 reg 0x0001
    status: proposed
    notes: >
      Emit the RAW heading. The decoder applies WIND_DIR_OFFSET = 230 for the site
      installation. Applying the offset in firmware as well double-corrects by 230
      degrees.

      The decoder NO LONGER nulls this field when wind_speed is 0. Upstream
      169e865 removed that behavior on the same no-fabricated-data grounds this
      repo applies: nulling stripped a heading the vane actually reported. The
      firmware instruction is unchanged — emit the raw heading and do not pre-null
      it — but the reason is now "the decoder passes it through", not "the decoder
      nulls it for you". Any calm-air interpretation belongs downstream of ingest.

  - name: temperature
    channel: 3
    type: 103
    size: 2
    signed: true
    divisor: 10
    unit: degC
    decoded_key: wx_temperature
    source: FIRMWARE_SPEC.md §2.1 reg 0x0002 (S16)
    status: proposed

  - name: humidity
    channel: 4
    type: 112          # MUST be 112, not 104 — see notes
    size: 2
    signed: false
    divisor: 10
    unit: "%RH"
    decoded_key: wx_humidity
    source: FIRMWARE_SPEC.md §2.1 reg 0x0003
    status: proposed
    notes: >
      TRAP: FIRMWARE_SPEC.md §6 lists "Humidity 104/112" as if interchangeable. They
      are not. Type 112 decodes to name "humidity_prec", giving key humidity_prec_4,
      which the decoder's CHANNELS map maps to wx_humidity. Type 104 decodes to name
      "humidity" (1 byte, divisor 2), giving key humidity_4 — which is NOT in CHANNELS
      and falls through as a raw key, missing every downstream consumer. Use 112.

      Since upstream 3cfd281 an unmapped key is passed through under its raw name with
      a decoder warning rather than dropped, so this mistake now costs the field's
      downstream consumers instead of the whole uplink. It is still a mistake.

  - name: pressure
    channel: 5
    type: 115
    size: 2
    signed: false
    divisor: 10
    unit: hPa
    decoded_key: wx_barometer
    source: FIRMWARE_SPEC.md §2.1 reg 0x0004
    status: proposed

  - name: batt_voltage
    channel: 21
    type: 186
    size: 2
    signed: false
    divisor: 100
    unit: V
    decoded_key: batt_voltage
    source: FIRMWARE_SPEC.md §2.2 reg 0x6000
    status: proposed

  - name: batt_current
    channel: 22
    type: 185
    size: 2
    signed: true
    divisor: 100
    unit: A
    decoded_key: batt_current
    source: FIRMWARE_SPEC.md §2.2 reg 0x6001
    status: proposed
    sign_convention: positive-is-charging
    notes: >
      SIGN CONVENTION, decided 2026-08-13 by the operator (docs/decisions/ADR-0002,
      "Resolution - conflict 1"): a POSITIVE value means the pack is CHARGING, a
      NEGATIVE value means the pack is DISCHARGING. Zero means neither, within one
      LSB of 0.01 A.

      This is the pack's own native telemetry convention, so NOTHING in the path
      applies a sign transform. The pack's two's-complement word is parsed verbatim
      (src/sensors/battery_frame.cpp), emitted verbatim (src/payload.cpp put_s16),
      and the decoder only sign-extends and divides by 100 - WX_TYPES[185] is
      signed: true, divisor: 100, and arrayToDecimal performs no negation. The
      decoder header at :16 documents the same convention in words. If you are
      reading this because you are about to add an inversion somewhere: do not. An
      inversion on either side alone silently reverses the record.

      The former contradiction is preserved in ADR-0002 rather than erased:
      FIRMWARE_SPEC.md §2.2 previously claimed "negative = charging per field docs".
      That claim lost - it was a field note describing the RAK2560 Hub's re-encoding,
      never a measurement of the pack - and §2.2 is corrected to match.

      NOT yet confirmed on hardware under a real charge current. The one bench
      reading (2026-08-12, -0.01 A on a discharging pack) is one LSB and is
      consistent with this convention without proving it.

  - name: batt_soc
    channel: 23
    type: 184
    size: 1
    signed: false
    divisor: 1
    unit: "%"
    decoded_key: batt_capacity
    source: FIRMWARE_SPEC.md §2.2 reg 0x6002
    status: proposed

  - name: batt_temperature
    channel: 24
    type: 103
    size: 2
    signed: true
    divisor: 10
    unit: degC
    decoded_key: batt_temperature
    source: ADR-0002 amendment (one-wire path per ADR-0004)
    status: proposed
    notes: >
      Scale depends on how the pack is read. The Modbus register 0x6009 reports whole
      degrees and would need a x10 before encoding. The one-wire path used today returns
      IPSO type 103 records, which already carry tenths, so the value passes through
      unscaled. Inferred from the IPSO type, not yet confirmed against hardware: at room
      temperature a reading near 210 confirms tenths, near 21 means the x10 is needed.

# Present in the decoder but NOT emitted by this device. Listed so the parity
# checker does not flag them as missing.
not_emitted:
  - decoded_key: hub_voltage      # channel 77, type 187 — RAK2560 Sensor Hub only
  - decoded_key: rak_serial       # channel 0,  type 126 — RAK2560 Sensor Hub only

# Changes that would REQUIRE a paired formatter change in forest-weather-machines.
# Landing any of these without the formatter change discards the whole uplink.
requires_formatter_change:
  - description: Firmware version reported in the uplink
    reason: >
      No channel/type currently carries a firmware version. docs/RELEASE.md wants
      the running version observable from ingest, which needs a new decoder entry.
    status: open
  - description: Per-sensor validity flags
    reason: >
      FIRMWARE_SPEC.md §5 allows a battery-only or weather-only uplink "with validity
      flags". The decoder has no flag type. Today, absence of a channel is the only
      validity signal — which is sufficient, but only because fields are omitted, not
      zeroed.
    status: open
