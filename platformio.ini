; PlatformIO project: rak-sensor-node
;
; Target:   RAK4631 (nRF52840 + SX1262) on a RAK19007 base board, US915.
; Contract: docs/FIRMWARE_SPEC.md defines the behavior. Do not diverge from it here.
; Build:    scripts/build.sh  — compiles on the Heliotrope Ridge build host.
; Flash:    scripts/flash.sh  — USB exists only on the build host (ADR-0001).
; Framework rationale: docs/decisions/ADR-0003-firmware-framework.md
;
; Why the board definition is vendored:
; The RAK4631 is not in the PlatformIO board registry. It is absent from
; platform-nordicnrf52 on both master and develop, absent from all 45 boards in the
; installed platform, and there is no matching Adafruit nRF52 variant. The files in
; rakwireless/ are the only source of it. RAK's older instructions copy them into
; ~/.platformio instead; that version dies on any toolchain reinstall and cannot work
; in CI at all. Vendored in-tree, the build is reproducible everywhere.
; Provenance and upstream pin: rakwireless/README.md

[platformio]
boards_dir = rakwireless/boards
default_envs = rak4631

; Settings every environment shares. The staged environments below differ only in which
; features they compile in, so a problem can be isolated to one subsystem without the
; others in the way.
[common]
platform = nordicnrf52
board = rak4630
framework = arduino

; The variant sources live outside src/, so they are added to the build explicitly and
; their headers placed on the include path. Both lines are required for the RAK4630/31.
build_src_filter = +<*> +<../rakwireless/variants/rak4630>

; Required for the USB CDC serial port to enumerate. Without it the board flashes
; successfully and then presents no serial port at all, which reads as a dead board.
; See docs/CITATIONS.md CIT-PIO-RAK4631-USB.
lib_archive = no
; RAK-OneWireSerial is not in the PlatformIO registry, so it comes straight from git, pinned
; to a commit. It supplies the timing-critical half-duplex 9600 transport the RAK9154 pack
; speaks: direct nRF port-register bit writes for TX and a GPIOTE falling-edge interrupt for
; RX. Our own digitalWrite() bit-bang overshot the 104 us bit period and the pack never
; answered. See docs/CITATIONS.md CIT-ONEWIRE-SERIAL and src/sensors/battery.cpp.
lib_deps =
	adafruit/Adafruit TinyUSB Library
	beegee-tokyo/SX126x-Arduino
	RAK-OneWireSerial=https://github.com/beegee-tokyo/RAK-OneWireSerial.git#c58c0f0760c7fe6ac54852dee9024077fc076d06

monitor_speed = 115200
monitor_filters = direct, time

; The field image: everything on, including sleep.
[env:rak4631]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags = -I rakwireless/variants/rak4630

; Off-target tests. The payload encoder and the Modbus checksum are pure computation with
; no Arduino dependency, so they compile and run on the build host in about a second. Both
; fail silently on real hardware — a mis-sized field decodes as plausible wrong numbers and
; a wrong checksum makes a working sensor look unplugged — which is exactly the kind of bug
; worth catching without a board attached.
;
;   pio test -e native
[env:native]
platform = native
build_flags =
	-std=gnu++17
	-I src
; The test runner excludes src/ unless told otherwise, so the filter alone is not enough —
; without this the tests compile and then fail to link against the code under test.
test_build_src = yes
build_src_filter = +<payload.cpp> +<sensors/crc16.cpp>

; Wind sensor only, awake, printing to USB. Nothing else can be responsible for a failure.
;
; FEATURE_BENCH_INTERVAL drops the reporting interval to 60 s so a sensor responds while
; somebody is still holding the harness. It is only safe here because FEATURE_RADIO=0 —
; nothing transmits, so no airtime is spent. src/config.h refuses to compile the two
; together, which is why stage3 below does not get it. See docs/FIRMWARE_SPEC.md §4.
[env:stage1]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1

; RS-485 bring-up diagnostic. Not a bring-up stage and not a field image — it sweeps the
; line and prints the raw bytes, so a silent sensor can be told apart from one answering in
; the wrong framing. The normal driver reports both as "timeout".
;
; Radio and sleep are off for the same reason as stage1: USB stays attached and nothing
; transmits. FEATURE_RK900=0 because the scan drives Serial1 itself and must not race the
; driver for the port.
[env:busscan]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BUS_SCAN=1

; One-wire bring-up diagnostic for the RAK9154 pack — the battery-side counterpart of
; busscan. The driver reports "no reply, 0 bytes" whether the pack never heard the request or
; answered where nothing was listening, and those need opposite responses: a meter in the
; first case, a constant in the second. This build counts falling edges on the bare pin
; before it assumes any protocol, then sweeps baud and probe id, printing every raw byte.
;
; FEATURE_BATTERY=0 because the scan drives the one-wire pin itself and must not race the
; driver for it — the library keeps its receive buffer and active object in class statics, so
; two owners means neither gets the bytes. FEATURE_RK900=0, radio and sleep off for the same
; reason as busscan: USB stays attached and nothing else can be responsible for a failure.
[env:owscan]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_ONEWIRE_SCAN=1

; Adds the battery. Still awake, still printing.
[env:stage2]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1

; Battery only, fast cadence. The iteration build for the RAK9154 bring-up.
;
; stage2 runs a 110.5 s cycle, of which the battery driver alone used 50.5 s — 45.4 s of that
; answering provisioning announcements that are now known not to latch, plus 3.1 s of guaranteed
; RK900 timeouts on a bus whose sensor is physically disconnected. Every experiment therefore
; cost two minutes of waiting and arrived buried in timeout noise. This build cuts the cycle to
; ~10 s: RK900 out (it is unplugged, and its 12 V feed on pack pin 1 is deliberately
; unconnected), radio and sleep out so USB stays attached, and FEATURE_BATTERY_FAST collapsing
; the provisioning window and the push listen to a few seconds each.
;
; Diagnostic only, never a field image: the short provisioning window is exactly the thing the
; long one exists to rule out, and a 10 s cadence has no legitimate use on a node meant to run
; for months.
[env:battdiag]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1
	-D FEATURE_BATTERY_FAST=1

; Adds the radio. Sleep stays off so the console remains attached while joins and uplinks
; are being watched — a sleeping board with no console is the hardest thing to diagnose.
;
; No FEATURE_BENCH_INTERVAL here, and src/config.h will not let one be added: once the
; radio is compiled in, a 60 s cadence is roughly 1440 uplinks a day against a fair-use
; allowance of about 30 s of airtime. Watching joins is what this stage is for, and that
; works at the normal 1800 s floor.
[env:stage3]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_SLEEP=0
