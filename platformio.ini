; PlatformIO project: rak-sensor-node
;
; Target:   RAK4631 (nRF52840 + SX1262) on a RAK19007 base board, US915.
; Contract: docs/FIRMWARE_SPEC.md defines the behavior. Do not diverge from it here.
; Build:    scripts/build.sh  — compiles on the Heliotrope Ridge build host.
; Flash:    scripts/flash.sh  — USB exists only on the build host (ADR-0001).
; Framework rationale: docs/decisions/ADR-0003-firmware-framework.md
;
; Why the board definition is vendored:
; The RAK4631 is not in the PlatformIO board registry. It is absent from
; platform-nordicnrf52 on both master and develop, absent from all 45 boards in the
; installed platform, and there is no matching Adafruit nRF52 variant. The files in
; rakwireless/ are the only source of it. RAK's older instructions copy them into
; ~/.platformio instead; that version dies on any toolchain reinstall and cannot work
; in CI at all. Vendored in-tree, the build is reproducible everywhere.
; Provenance and upstream pin: rakwireless/README.md

[platformio]
boards_dir = rakwireless/boards
default_envs = rak4631

; Settings every environment shares. The staged environments below differ only in which
; features they compile in, so a problem can be isolated to one subsystem without the
; others in the way.
[common]
platform = nordicnrf52
board = rak4630
framework = arduino

; The variant sources live outside src/, so they are added to the build explicitly and
; their headers placed on the include path. Both lines are required for the RAK4630/31.
build_src_filter = +<*> +<../rakwireless/variants/rak4630>

; Required for the USB CDC serial port to enumerate. Without it the board flashes
; successfully and then presents no serial port at all, which reads as a dead board.
; See docs/CITATIONS.md CIT-PIO-RAK4631-USB.
lib_archive = no
; RAK-OneWireSerial is not in the PlatformIO registry, so it comes straight from git, pinned
; to a commit. It supplies the timing-critical half-duplex 9600 transport the RAK9154 pack
; speaks: direct nRF port-register bit writes for TX and a GPIOTE falling-edge interrupt for
; RX. Our own digitalWrite() bit-bang overshot the 104 us bit period and the pack never
; answered. See docs/CITATIONS.md CIT-ONEWIRE-SERIAL and src/sensors/battery.cpp.
lib_deps =
	adafruit/Adafruit TinyUSB Library
	beegee-tokyo/SX126x-Arduino
	RAK-OneWireSerial=https://github.com/beegee-tokyo/RAK-OneWireSerial.git#c58c0f0760c7fe6ac54852dee9024077fc076d06

monitor_speed = 115200
monitor_filters = direct, time

; Stamps the boot banner with the git commit the image was built from, as
; -D FIRMWARE_COMMIT="a7381e7" (with `-dirty` when the tree was not clean). docs/EVIDENCE.md
; cannot accept a result without a SHA, and the banner previously carried only a version and a
; __DATE__/__TIME__ stamp — so two builds of 0.4.1 read identically on the console and a board
; in the field could not be matched to a commit at all. Degrades to "unknown" rather than
; failing when there is no git history to read. Rationale and citations in the script itself.
extra_scripts = pre:scripts/pio_git_rev.py


; The field image: everything on, including sleep, and the console compiled IN.
;
; FEATURE_CONSOLE=1 here is a REVERT, made deliberately on 2026-08-12. This environment briefly
; built FEATURE_CONSOLE=0 on the strength of RAK's low-power document, which says the serial
; port "MUST NOT be initialized" because FreeRTOS starts a background task for it that never
; sleeps. Read against the core's own source, that mechanism is false, and on RAK's own BSP:
;
;   - Adafruit_USBD_Device::begin() calls SerialTinyUSB.begin(115200) itself at
;     Adafruit_USBD_Device.cpp:262 — commented "Serial is always added by default" — and creates
;     the usbd task at :265. That runs from cores/nRF5/main.cpp:52, BEFORE setup(). So our own
;     Serial.begin() in src/main.cpp hits `if (isValid()) return;` (Adafruit_USBD_CDC.cpp:95)
;     and does nothing whatsoever. FEATURE_CONSOLE=0 buys "does not print". It does not remove
;     a task, a peripheral, or a clock, so it cannot save the milliamps this comment predicted.
;   - RAK's BSP defines -DUSE_TINYUSB unconditionally (platform.txt:72, and boards.txt has no
;     usbstack menu to opt out with), and their cores/nRF5/main.cpp is byte-identical to
;     Adafruit's — so RAK's own MAX_SAVE builds get the same task they warn about.
;   - The task blocks rather than spins: tud_task() waits on xQueueReceive(.., portMAX_DELAY)
;     (tinyusb usbd.c:686, osal_freertos.h:81), so it does not hold the CPU out of tickless idle.
;
; The real lever is VBUS, then detach(). NRF_USBD->ENABLE is only ever set from the VBUS power
; event handler (dcd_nrf5x.c:927), so in the field — no cable — the peripheral is not enabled no
; matter what we build, and src/power.cpp:135 already calls detach() to stop host polling. We
; were already using the best lever the API offers. Serial.end() stays uncalled: it only clears
; the configuration descriptor the host enumerated, and removes no current either.
;
; What the revert buys back is a deployed node that can be diagnosed over a cable without a
; reflash. That is not hypothetical — issue #58 has the only board we own presenting no USB
; device at all, and shipping a silent image while the board is already unreachable is the wrong
; direction. Full analysis with every citation:
; docs/reviews/2026-08-12_console_sleep_question.md, and the decision in
; docs/decisions/ADR-0008-console-in-the-field-image.md.
;
; Do not set this to 0 again without a meter showing a difference (#47). Mechanism has been
; established; magnitude has not, and no document here may claim a saving until it is measured.
[env:rak4631]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_CONSOLE=1

; The field image for a core whose WB_IO1 is damaged. Identical to [env:rak4631] except that the
; RAK9154 one-wire link is driven from WB_A1/P0.31 instead of WB_IO1/P0.17.
;
; A separate environment rather than an edited constant because the choice belongs to one
; physical core, not to the firmware: three cores measured ~3.86 ohm from IO1 to ground on
; 2026-08-29 (issue #96) and cannot use IO1, while a healthy core must not inherit the
; workaround — A1 is only reachable on the base-board extension header, so shipping it by
; default silently costs a node its documented harness.
;
; A node flashed from here is NOT wired like the others. Record which pin produced any reading
; in docs/EVIDENCE.md; a pack voltage with no pin attached to it is not attributable.
[env:rak4631_a1]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_CONSOLE=1
	-D FEATURE_BATTERY_PIN_A1=1

; The soak image: a named entry point for the soak, carrying NO build difference at all.
;
; This is now byte-identical to [env:rak4631] — same flags, same everything — because the
; FEATURE_CONSOLE=0 revert above removed the one flag that used to distinguish them. That
; identity is the whole point rather than an oversight, and it is a stronger position than the
; one this environment was created to defend: H8 asks for >=24 h on the bench, and a soak only
; counts as evidence about the field image to the extent that it IS the field image. Previously
; that required an argument about one flag being harmless. Now it requires none.
;
; It survives as a separate [env:] for two concrete reasons, not as a build variant:
;   - scripts/soak.sh, docs/SOAK.md, README.md, AGENTS.md and docs/FIRMWARE_SPEC.md all name
;     `env:soak`. Deleting it would break every one of those call sites and instructions.
;   - `pio run -e soak` records at the call site what the run is for, which a soak log carrying
;     an environment name is better for.
;
; DO NOT add a build flag here. The moment this differs from [env:rak4631] in anything, a soak
; stops being evidence about the shipped image and H8 has to be re-argued. If a bench-only
; behavior is ever genuinely needed, it belongs in one of the stageN environments, not here.
;
; The cadence is deliberately not named as a number. It is a persisted runtime setting, not a
; build-time one: src/config.h gives the field build kIntervalMinSeconds = kFupFloorSeconds =
; 900 s and kIntervalDefaultSeconds = 3600 s, a downlink can move it anywhere in between (up
; to kIntervalMaxSeconds = 86400 s), and the stored value survives a reset. So a comment here
; quoting one figure is wrong the moment the node is commanded — this comment previously said
; 1800 s, which matched neither the floor nor the default, while the network-side uplink
; timestamps showed 900 s. Read the interval off the console banner, which prints the live
; bounds and the stored value, rather than trusting any figure written here.
;
; Use this for the 24 h bench soak and for any observation of the field cycle. Either name now
; produces the same firmware, so there is no longer a "measure with that one, watch with this
; one" distinction to get wrong — the current measurement in #47 compares this image against
; itself with the cable in and out, not two different builds.
[env:soak]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_CONSOLE=1

; Off-target tests. The payload encoder, the Modbus checksum and the RAK9154 one-wire frame
; codec are pure computation with
; no Arduino dependency, so they compile and run on the build host in about a second. Both
; fail silently on real hardware — a mis-sized field decodes as plausible wrong numbers and
; a wrong checksum makes a working sensor look unplugged — which is exactly the kind of bug
; worth catching without a board attached. The battery codec is here for the same reason and a
; sharper one: a truncated announcement misclassified as an all-zero record set cost days of
; bench time (issue #42), and it is reachable from a fixed byte array in microseconds.
;
;   pio test -e native
[env:native]
platform = native
; gnu++11, matching the device. The Arduino nRF52 core builds at gnu++11, and a host suite
; compiling at a newer standard means the tests are not exercising the same language rules as
; the firmware. That is not theoretical: a full 10/10 host pass once went green on code that
; could not compile for the board at all, because a struct with default member initialisers is
; an aggregate under C++14 and later but not under C++11, so every brace-initialised call site
; failed only on the device (fixed in df15867). A green host suite has to mean the code builds.
build_flags =
	-std=gnu++11
	-I src
; The test runner excludes src/ unless told otherwise, so the filter alone is not enough —
; without this the tests compile and then fail to link against the code under test.
test_build_src = yes
build_src_filter = +<payload.cpp> +<sensors/crc16.cpp> +<sensors/battery_frame.cpp>
; native does not extend [common], so the commit stamp is named again here. This environment
; never compiles the banner — the filter above excludes main.cpp — but the define is one -D and
; keeping every environment stamped means no build in this file can be built without knowing
; which commit produced it.
extra_scripts = pre:scripts/pio_git_rev.py

; Wind sensor only, awake, printing to USB. Nothing else can be responsible for a failure.
;
; FEATURE_BENCH_INTERVAL drops the reporting interval to 60 s so a sensor responds while
; somebody is still holding the harness. It is only safe here because FEATURE_RADIO=0 —
; nothing transmits, so no airtime is spent. src/config.h refuses to compile the two
; together, which is why stage3 below does not get it. See docs/FIRMWARE_SPEC.md §4.
[env:stage1]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1

; RS-485 bring-up diagnostic. Not a bring-up stage and not a field image — it sweeps the
; line and prints the raw bytes, so a silent sensor can be told apart from one answering in
; the wrong framing. The normal driver reports both as "timeout".
;
; Radio and sleep are off for the same reason as stage1: USB stays attached and nothing
; transmits. FEATURE_RK900=0 because the scan drives Serial1 itself and must not race the
; driver for the port.
[env:busscan]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BUS_SCAN=1

; One-wire bring-up diagnostic for the RAK9154 pack — the battery-side counterpart of
; busscan. The driver reports "no reply, 0 bytes" whether the pack never heard the request or
; answered where nothing was listening, and those need opposite responses: a meter in the
; first case, a constant in the second. This build counts falling edges on the bare pin
; before it assumes any protocol, then sweeps baud and probe id, printing every raw byte.
;
; FEATURE_BATTERY=0 because the scan drives the one-wire pin itself and must not race the
; driver for it — the library keeps its receive buffer and active object in class statics, so
; two owners means neither gets the bytes. FEATURE_RK900=0, radio and sleep off for the same
; reason as busscan: USB stays attached and nothing else can be responsible for a failure.
[env:owscan]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_ONEWIRE_SCAN=1

; The same one-wire scan for a node wired to A1 (see [env:rak4631_a1]). Identical to
; [env:owscan] plus FEATURE_BATTERY_PIN_A1=1, so the pin it measures is the pin the pack is
; actually on. Scanning IO1 on an A1-wired node measures an unconnected pad and reports it as a
; dead bus.
[env:owscan_a1]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_ONEWIRE_SCAN=1
	-D FEATURE_BATTERY_PIN_A1=1

; The control for the one-wire scan: the same census on WB_A0, a base-board pad this project
; has never wired to anything. A "held low" verdict on IO1 or A1 only means something if a
; never-connected pad on the same core reads differently, and on 2026-08-30 IO1 and A1 both read
; 100 % low with the harness fully off — so this env exists to tell "the pad is shorted" apart
; from "every pad reads low, therefore the reading is not about the pad."
[env:owscan_a0]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_ONEWIRE_SCAN=1
	-D OWSCAN_PIN=WB_A0

; The one-wire census on WB_I2C1_SDA / P0.13 — the candidate recovery pad after IO1 and A1 both
; went held-low on node 002's core. SDA is on the edge header (`SDA SCL TX1 RX1 GND VDD BOOT0`),
; is a real core GPIO, and this project uses no I2C sensor, so nothing contends for it.
;
; Its only job is to qualify the pad BEFORE anything is soldered to it. A pad is never selected
; for the pack by elimination — only after this census reports idle HIGH on it.
[env:owscan_sda]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_BATTERY=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_ONEWIRE_SCAN=1
	-D OWSCAN_PIN=WB_I2C1_SDA

; Adds the battery. Still awake, still printing.
[env:stage2]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1

; Battery only, fast cadence. The iteration build for the RAK9154 bring-up.
;
; stage2 runs a 110.5 s cycle, of which the battery driver alone used 50.5 s — 45.4 s of that
; answering provisioning announcements that are now known not to latch, plus 3.1 s of guaranteed
; RK900 timeouts on a bus whose sensor is physically disconnected. Every experiment therefore
; cost two minutes of waiting and arrived buried in timeout noise. This build cuts the cycle to
; ~10 s: RK900 out (it is unplugged, and its 12 V feed on pack pin 1 is deliberately
; unconnected), radio and sleep out so USB stays attached, and FEATURE_BATTERY_FAST collapsing
; the provisioning window and the push listen to a few seconds each.
;
; Diagnostic only, never a field image: the short provisioning window is exactly the thing the
; long one exists to rule out, and a 10 s cadence has no legitimate use on a node meant to run
; for months.
[env:battdiag]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1
	-D FEATURE_BATTERY_FAST=1

; The same battery diagnostic for a node wired to A1 (see [env:rak4631_a1]). Identical to
; [env:battdiag] plus FEATURE_BATTERY_PIN_A1=1.
;
; It exists because running plain [env:battdiag] against an A1-wired node drives IO1, gets
; `no reply, 0 bytes`, and reads as a dead pack — a false negative produced by the diagnostic
; itself, which is the worst kind on a bench.
[env:battdiag_a1]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_RK900=0
	-D FEATURE_RADIO=0
	-D FEATURE_SLEEP=0
	-D FEATURE_BENCH_INTERVAL=1
	-D FEATURE_BATTERY_FAST=1
	-D FEATURE_BATTERY_PIN_A1=1

; Adds the radio. Sleep stays off so the console remains attached while joins and uplinks
; are being watched — a sleeping board with no console is the hardest thing to diagnose.
;
; No FEATURE_BENCH_INTERVAL here, and src/config.h will not let one be added: once the
; radio is compiled in, a 60 s cadence is roughly 1440 uplinks a day against a fair-use
; allowance of about 30 s of airtime. Watching joins is what this stage is for, and that
; works at the field floor — 900 s, per kFupFloorSeconds in src/config.h. This comment said
; 1800 s, which was the floor before it was lowered for 15-minute reporting; the constant is
; the single source of truth and this line had drifted from it.
[env:stage3]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
build_src_filter = ${common.build_src_filter}
lib_archive = ${common.lib_archive}
lib_deps = ${common.lib_deps}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
build_flags =
	-I rakwireless/variants/rak4630
	-D FEATURE_SLEEP=0
